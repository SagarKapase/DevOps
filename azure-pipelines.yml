trigger:
- master

pool:
  Default

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore DeploymentDemo.Product.Api/DeploymentDemo.Product.Api.csproj
  displayName: 'Restore Product API'

- script: dotnet build DeploymentDemo.Product.Api/DeploymentDemo.Product.Api.csproj --configuration Release --no-restore
  displayName: 'Build Product API'

- script: dotnet test DeploymentDemo.Product.Api.Tests/DeploymentDemo.Product.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"
  displayName: 'Run Product API Tests'

- task: PublishTestResults@2
  displayName: 'Publish Test Results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true